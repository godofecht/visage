name: CMake resource embedding smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  legacy-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure legacy resource generator
        run: cmake -S tests/cmake-custom-rules -B build/visage-embed-smoke -DVISAGE_USE_CUSTOM_RULES=OFF
      - name: Compile embedded-resource smoke target
        run: cmake --build build/visage-embed-smoke --parallel 2
      - name: Verify bytes
        run: ctest --test-dir build/visage-embed-smoke --output-on-failure

  cmake45-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake 4.5.0-rc1
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-linux-x86_64.tar.gz \
            -o /tmp/cmake-4.5.0-rc1.tar.gz
          tar -xzf /tmp/cmake-4.5.0-rc1.tar.gz
          echo "$PWD/cmake-4.5.0-rc1-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Configure typed resource rules
        run: cmake -S tests/cmake-custom-rules -B build/visage-embed-custom -DVISAGE_USE_CUSTOM_RULES=ON
      - name: Compile embedded-resource smoke target
        run: cmake --build build/visage-embed-custom --parallel 2
      - name: Verify generated bytes
        run: ctest --test-dir build/visage-embed-custom --output-on-failure

  shader-build-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake 4.5.0-rc1
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-linux-x86_64.tar.gz \
            -o /tmp/cmake-4.5.0-rc1.tar.gz
          tar -xzf /tmp/cmake-4.5.0-rc1.tar.gz
          echo "$PWD/cmake-4.5.0-rc1-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Make the shader compiler fixture executable
        run: chmod +x tests/cmake-shader-rules/fake_shaderc.sh
      - name: Configure and test legacy shader pipeline
        run: |
          cmake -S tests/cmake-shader-rules -B build/shader-legacy -DVISAGE_USE_CUSTOM_RULES=OFF
          cmake --build build/shader-legacy --parallel 2
          ctest --test-dir build/shader-legacy --output-on-failure
      - name: Configure and test CMake 4.5 custom shader rules
        run: |
          cmake -S tests/cmake-shader-rules -B build/shader-custom -DVISAGE_USE_CUSTOM_RULES=ON
          cmake --build build/shader-custom --parallel 2
          ctest --test-dir build/shader-custom --output-on-failure
