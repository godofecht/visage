name: CMake resource embedding smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  legacy-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure legacy resource generator
        run: cmake -S tests/cmake-custom-rules -B build/visage-embed-smoke -DVISAGE_USE_CUSTOM_RULES=OFF
      - name: Compile embedded-resource smoke target
        run: cmake --build build/visage-embed-smoke --parallel 2
      - name: Verify bytes
        run: ctest --test-dir build/visage-embed-smoke --output-on-failure
